name: Java CI with Maven

on:
  push:
    branches: [ "main", "master", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean compile -f VanguardSecureChatAuth/pom.xml

    - name: Run Login Class Tests (Part 1)
      run: mvn test -Dtest=LoginTest -f VanguardSecureChatAuth/pom.xml

    - name: Run Message Class Tests (Part 2)
      run: mvn test -Dtest=MessageTest -f VanguardSecureChatAuth/pom.xml

    - name: Run All Unit Tests with Maven Surefire
      run: mvn test -f VanguardSecureChatAuth/pom.xml
